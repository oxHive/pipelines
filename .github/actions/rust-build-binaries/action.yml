name: Rust Build Binaries
description: Cross-compile the crate for one target and upload the packaged binary as a tarball artifact.

inputs:
  binary-name:
    description: Binary file name produced by `cargo build --release`
    required: true
  target:
    description: Rust target triple to build for (e.g. `x86_64-unknown-linux-gnu`)
    required: true
  dashboard-dir:
    description: Path to a bun-managed dashboard whose `dashboard-dist` artifact is downloaded into `<dir>/dist` before the build. Leave empty to skip.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-tags: true

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.target }}

    - name: Download dashboard
      if: inputs.dashboard-dir != ''
      uses: actions/download-artifact@v8
      with:
        name: dashboard-dist
        path: ${{ inputs.dashboard-dir }}/dist

    - name: Build
      shell: bash
      run: cargo build --release --target ${{ inputs.target }}

    - name: Package
      id: package
      shell: bash
      run: |
        artifact="${{ inputs.binary-name }}-${{ inputs.target }}"
        mkdir dist
        cp target/${{ inputs.target }}/release/${{ inputs.binary-name }} dist/
        tar -czf ${artifact}.tar.gz -C dist ${{ inputs.binary-name }}
        echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.package.outputs.artifact }}
        path: ${{ steps.package.outputs.artifact }}.tar.gz
