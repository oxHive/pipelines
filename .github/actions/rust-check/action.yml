name: Rust Check
description: Run cargo fmt, clippy, and tarpaulin coverage against the checked-out crate.

inputs:
  fail-under-coverage:
    description: Minimum code coverage percentage
    default: "60"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      shell: bash
      run: cargo fmt --check

    - name: Clippy
      shell: bash
      run: cargo clippy -- -D warnings

    - name: Install cargo-tarpaulin
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-tarpaulin

    - name: Check coverage
      shell: bash
      run: cargo tarpaulin --out Xml --fail-under ${{ inputs.fail-under-coverage }}
