name: Rust Publish Docker
description: Build and push a multi-arch Docker image to the GitHub Container Registry (GHCR).

inputs:
  image-name:
    description: Docker image name, without the registry/owner prefix
    required: true
  dockerfile:
    description: Path to the Dockerfile
    default: "Dockerfile"
  context:
    description: Docker build context
    default: "."
  platforms:
    description: Comma-separated target platforms to build for
    default: "linux/amd64,linux/arm64"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7

    - uses: docker/setup-qemu-action@v3

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Compute image version
      id: version
      shell: bash
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ steps.version.outputs.version }}
          ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:latest
