name: Publish Docker
description: >
  Build and push a multi-arch (linux/amd64, linux/arm64) Docker image to the
  GitHub Container Registry (GHCR), reusing the binaries rust-build-binaries
  already cross-compiled. The Dockerfile must COPY the binary from
  dist/linux-${TARGETARCH}/<binary-name> (staged automatically by this
  action) instead of building it itself.

inputs:
  binary-name:
    description: Binary file name produced by `cargo build --release` (used to locate downloaded build artifacts)
    required: true
  image-name:
    description: Docker image name, without the registry/owner prefix
    required: true
  dockerfile:
    description: Path to the Dockerfile
    default: "Dockerfile"
  context:
    description: Docker build context
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true

    - name: Stage binaries for TARGETARCH-based COPY
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${{ inputs.context }}/dist/linux-amd64" "${{ inputs.context }}/dist/linux-arm64"
        tar -xzf artifacts/${{ inputs.binary-name }}-x86_64-unknown-linux-gnu.tar.gz -C "${{ inputs.context }}/dist/linux-amd64"
        tar -xzf artifacts/${{ inputs.binary-name }}-aarch64-unknown-linux-gnu.tar.gz -C "${{ inputs.context }}/dist/linux-arm64"

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Compute image version
      id: version
      shell: bash
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ steps.version.outputs.version }}
          ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:latest
