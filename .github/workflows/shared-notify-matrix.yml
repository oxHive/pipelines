name: Notify Matrix Release

on:
  workflow_call:
    secrets:
      MATRIX_HOMESERVER:
        required: false
      MATRIX_USER:
        required: false
      MATRIX_PASSWORD:
        required: false
      MATRIX_ROOM_ID:
        required: false

jobs:
  notify-matrix:
    runs-on: ubuntu-latest
    env:
      MATRIX_USER: ${{ secrets.MATRIX_USER }}
    steps:
      - name: Download changelog
        if: ${{ env.MATRIX_USER != '' }}
        uses: actions/download-artifact@v8
        with:
          name: changelog

      - name: Read changelog
        if: ${{ env.MATRIX_USER != '' }}
        id: changelog
        run: |
          {
            echo 'content<<EOF'
            cat CHANGES.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Notify Matrix
        if: ${{ env.MATRIX_USER != '' }}
        continue-on-error: true
        uses: oxGrad/matrix-notify-action@v1
        with:
          homeserver: ${{ secrets.MATRIX_HOMESERVER }}
          user: ${{ secrets.MATRIX_USER }}
          password: ${{ secrets.MATRIX_PASSWORD }}
          room_id: ${{ secrets.MATRIX_ROOM_ID }}
          format: markdown
          msgtype: m.text
          message: |
            Released [${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }})

            ${{ steps.changelog.outputs.content }}
