name: Shared Major Tag

on:
  workflow_call:
    secrets:
      MAJOR_TAG_TOKEN:
        description: PAT with `repo` + `workflow` scope. Required because GITHUB_TOKEN can never push a ref whose commit touches .github/workflows/*, regardless of `permissions:`.
        required: true

jobs:
  major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.MAJOR_TAG_TOKEN }}

      - name: Move major version tag
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "'$TAG' is not a full semver tag (vX.Y.Z), skipping"
            exit 0
          fi
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" "$TAG"
          git push origin "$MAJOR" --force
