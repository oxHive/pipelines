name: Notify Discord

on:
  workflow_call:
    inputs:
      message:
        description: Message body to send to Discord (markdown)
        type: string
        required: true
      append-changelog:
        description: Download the `changelog` artifact and append CHANGES.md to the message
        type: boolean
        default: false
      alert:
        description: Send to the alert webhook (DISCORD_ALERT_WEBHOOK_URL) instead of the release webhook
        type: boolean
        default: false
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false
      DISCORD_ALERT_WEBHOOK_URL:
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ inputs.alert && secrets.DISCORD_ALERT_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Download changelog
        if: ${{ env.DISCORD_WEBHOOK_URL != '' && inputs.append-changelog }}
        uses: actions/download-artifact@v8
        with:
          name: changelog

      - name: Read changelog
        if: ${{ env.DISCORD_WEBHOOK_URL != '' && inputs.append-changelog }}
        id: changelog
        run: |
          {
            echo 'content<<EOF'
            cat CHANGES.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        continue-on-error: true
        env:
          DISCORD_MESSAGE: |
            ${{ inputs.message }}

            ${{ steps.changelog.outputs.content }}
        run: |
          payload=$(jq -n --arg content "$DISCORD_MESSAGE" '{content: $content}')
          curl -sS --fail-with-body \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
