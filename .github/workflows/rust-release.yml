name: Rust Release

on:
  workflow_call:
    inputs:
      package-name:
        description: Cargo package name used in Cargo.toml (for version verification)
        type: string
        required: true
      binary-name:
        description: Binary file name produced by `cargo build --release`
        type: string
        required: true
      dashboard-dir:
        description: Path to a bun-managed dashboard to build and embed before `cargo build --release` (e.g. `dashboard`). Leave empty to skip.
        type: string
        default: ""
      homebrew-owner:
        description: GitHub owner/org of the Homebrew tap repo
        type: string
        default: "oxhive"
      homebrew-tap:
        description: Name of the Homebrew tap repo (as it appears on GitHub)
        type: string
        default: "homebrew-tap"
      homebrew-install:
        description: Ruby install block for the Homebrew formula, e.g. `bin.install "mytool"`. Leave empty to skip Homebrew publishing.
        type: string
        default: ""
      homebrew-test-command:
        description: Ruby test block for the Homebrew formula, e.g. `system "#{bin}/mytool", "--version"`
        type: string
        default: ""
    secrets:
      MATRIX_HOMESERVER:
        required: false
      MATRIX_USER:
        required: false
      MATRIX_PASSWORD:
        required: false
      MATRIX_ROOM_ID:
        required: false
      MATRIX_ALERT_ROOM_ID:
        required: false
      HOMEBREW_TAP_TOKEN:
        required: false

jobs:
  verify-version:
    uses: oxHive/pipelines/.github/workflows/rust-verify-version.yml@main
    with:
      package-name: ${{ inputs.package-name }}

  check:
    needs: verify-version
    uses: oxHive/pipelines/.github/workflows/rust-check.yml@main

  audit:
    needs: verify-version
    uses: oxHive/pipelines/.github/workflows/rust-audit.yml@main

  build-binaries:
    needs: [check, audit]
    uses: oxHive/pipelines/.github/workflows/rust-build-binaries.yml@main
    with:
      binary-name: ${{ inputs.binary-name }}
      dashboard-dir: ${{ inputs.dashboard-dir }}

  github-release:
    needs: build-binaries
    uses: oxHive/pipelines/.github/workflows/shared-github-release.yml@main

  publish-crates:
    needs: github-release
    uses: oxHive/pipelines/.github/workflows/rust-publish-crates.yml@main
    permissions:
      id-token: write
      contents: read

  publish-homebrew:
    needs: github-release
    if: inputs.homebrew-install != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: oxHive/pipelines/.github/actions/rust-publish-homebrew@main
        with:
          binary-name: ${{ inputs.binary-name }}
          homebrew-owner: ${{ inputs.homebrew-owner }}
          homebrew-tap: ${{ inputs.homebrew-tap }}
          install: ${{ inputs.homebrew-install }}
          test-command: ${{ inputs.homebrew-test-command }}
          homebrew-tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  notify-matrix:
    needs: [publish-crates, publish-homebrew]
    if: always() && !failure() && !cancelled()
    uses: oxHive/pipelines/.github/workflows/shared-notify-matrix.yml@main
    secrets:
      MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
      MATRIX_USER: ${{ secrets.MATRIX_USER }}
      MATRIX_PASSWORD: ${{ secrets.MATRIX_PASSWORD }}
      MATRIX_ROOM_ID: ${{ secrets.MATRIX_ROOM_ID }}

  notify-failure:
    needs: [verify-version, check, audit, build-binaries, github-release, publish-crates, publish-homebrew]
    if: failure()
    uses: oxHive/pipelines/.github/workflows/shared-notify-failure.yml@main
    with:
      message: "Release pipeline failed for `${{ github.ref_name }}`: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets:
      MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
      MATRIX_USER: ${{ secrets.MATRIX_USER }}
      MATRIX_PASSWORD: ${{ secrets.MATRIX_PASSWORD }}
      MATRIX_ALERT_ROOM_ID: ${{ secrets.MATRIX_ALERT_ROOM_ID }}
