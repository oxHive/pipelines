name: Rust Release

on:
  workflow_call:
    inputs:
      package-name:
        description: Cargo package name used in Cargo.toml (for version verification)
        type: string
        required: true
      binary-name:
        description: Binary file name produced by `cargo build --release`
        type: string
        required: true
      dashboard-dir:
        description: Path to a bun-managed dashboard to build and embed before `cargo build --release` (e.g. `dashboard`). Leave empty to skip.
        type: string
        default: ""
      homebrew-owner:
        description: GitHub owner/org of the Homebrew tap repo
        type: string
        default: "oxhive"
      homebrew-tap:
        description: Name of the Homebrew tap repo (as it appears on GitHub)
        type: string
        default: "homebrew-tap"
      homebrew-install:
        description: Ruby install block for the Homebrew formula, e.g. `bin.install "mytool"`. Leave empty to skip Homebrew publishing.
        type: string
        default: ""
      homebrew-test-command:
        description: Ruby test block for the Homebrew formula, e.g. `system "#{bin}/mytool", "--version"`
        type: string
        default: ""
      publish-crates:
        description: Whether to run the publish-crates job
        type: boolean
        default: false
      publish-homebrew:
        description: Whether to run the publish-homebrew job
        type: boolean
        default: false
      notify-provider:
        description: Which notifier(s) to call on release/failure. One of `matrix`, `discord`, `both`, `none`.
        type: string
        default: matrix
    secrets:
      MATRIX_HOMESERVER:
        required: false
      MATRIX_USER:
        required: false
      MATRIX_PASSWORD:
        required: false
      MATRIX_ROOM_ID:
        required: false
      MATRIX_ALERT_ROOM_ID:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false
      DISCORD_ALERT_WEBHOOK_URL:
        required: false
      HOMEBREW_TAP_TOKEN:
        required: false
      HOMEBREW_APP_ID:
        required: false
      HOMEBREW_APP_PRIVATE_KEY:
        required: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/rust-verify-version
        with:
          package-name: ${{ inputs.package-name }}

  check:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/rust-check

  audit:
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: $/.github/actions/rust-audit

  build-dashboard:
    needs: [check, audit]
    if: inputs.dashboard-dir != ''
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/bun-build
        with:
          working-directory: ${{ inputs.dashboard-dir }}
          artifact-name: dashboard-dist

  build-binaries:
    needs: [check, audit, build-dashboard]
    if: always() && !failure() && !cancelled()
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: $/.github/actions/rust-build-binaries
        with:
          binary-name: ${{ inputs.binary-name }}
          target: ${{ matrix.target }}
          dashboard-dir: ${{ inputs.dashboard-dir }}

  github-release:
    needs: build-binaries
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: $/.github/actions/github-release

  publish-crates:
    needs: github-release
    if: always() && !failure() && !cancelled() && inputs.publish-crates && !contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: $/.github/actions/rust-publish-crates

  publish-homebrew:
    needs: github-release
    if: always() && !failure() && !cancelled() && inputs.publish-homebrew && inputs.homebrew-install != '' && !contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: $/.github/actions/rust-publish-homebrew
        with:
          binary-name: ${{ inputs.binary-name }}
          homebrew-owner: ${{ inputs.homebrew-owner }}
          homebrew-tap: ${{ inputs.homebrew-tap }}
          install: ${{ inputs.homebrew-install }}
          test-command: ${{ inputs.homebrew-test-command }}
          homebrew-tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          homebrew-app-id: ${{ secrets.HOMEBREW_APP_ID }}
          homebrew-app-private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}

  notify-matrix:
    needs: [publish-crates, publish-homebrew]
    if: always() && !failure() && !cancelled() && contains(fromJSON('["matrix", "both"]'), inputs.notify-provider)
    uses: $/.github/workflows/notify-matrix.yml
    with:
      append-changelog: true
      message: "Released [${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }})"
    secrets:
      MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
      MATRIX_USER: ${{ secrets.MATRIX_USER }}
      MATRIX_PASSWORD: ${{ secrets.MATRIX_PASSWORD }}
      MATRIX_ROOM_ID: ${{ secrets.MATRIX_ROOM_ID }}

  notify-discord:
    needs: [publish-crates, publish-homebrew]
    if: always() && !failure() && !cancelled() && contains(fromJSON('["discord", "both"]'), inputs.notify-provider)
    uses: $/.github/workflows/notify-discord.yml
    with:
      append-changelog: true
      message: "Released [${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }})"
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  notify-failure-matrix:
    needs:
      [
        verify-version,
        check,
        audit,
        build-dashboard,
        build-binaries,
        github-release,
        publish-crates,
        publish-homebrew,
      ]
    if: failure() && contains(fromJSON('["matrix", "both"]'), inputs.notify-provider)
    uses: $/.github/workflows/notify-matrix.yml
    with:
      alert: true
      message: "Release pipeline failed for `${{ github.ref_name }}`: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets:
      MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
      MATRIX_USER: ${{ secrets.MATRIX_USER }}
      MATRIX_PASSWORD: ${{ secrets.MATRIX_PASSWORD }}
      MATRIX_ALERT_ROOM_ID: ${{ secrets.MATRIX_ALERT_ROOM_ID }}

  notify-failure-discord:
    needs:
      [
        verify-version,
        check,
        audit,
        build-dashboard,
        build-binaries,
        github-release,
        publish-crates,
        publish-homebrew,
      ]
    if: failure() && contains(fromJSON('["discord", "both"]'), inputs.notify-provider)
    uses: $/.github/workflows/notify-discord.yml
    with:
      alert: true
      message: "Release pipeline failed for `${{ github.ref_name }}`: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets:
      DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
